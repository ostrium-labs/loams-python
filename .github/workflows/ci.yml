name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SDK from the monorepo (PyPI fallback)
        run: |
          pip install loams==0.1.0 || {
            git clone --depth 1 https://github.com/ostrium-labs/loams /tmp/loams
            pip install /tmp/loams/sdks/python
          }
          pip install fastapi uvicorn
      - name: Compile and import-check the examples
        run: |
          python -m compileall -q quickstart sql fastapi-search
          cd fastapi-search && python -c "import app"
